<!DOCTYPE html>
<html lang="pt-br">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropSens - Cadastro</title>
    <link rel="stylesheet" href="../css/style-cadastro.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300..700&display=swap">
</head>

<body>
    <div class="container">
        <a href="index.html"><img src="/img/CropSens.png" class="logo" alt=""></a>
        <p class="paragrafo">Cultive o futuro <br> com <span class="dados_precisos">dados precisos</span></p>
        <div class="card">
            <div class="form">
                <h1>Criar conta</h1>
                <p>Preencha os dados abaixo.</p>
                
                <span class="texto">Nome completo:<span style="color: red;"> *</span></span>
                <input id="ipt_nome" class="nome" placeholder="Digite seu nome completo">
                <div class="erro" id="erro1"></div>

                <span class="texto">E-mail:<span style="color: red;"> *</span></span>
                <input id="ipt_email" class="email" placeholder="email@exemplo.com">
                <div class="erro" id="erro2"></div>

                <span class="texto">Telefone:<span style="color: red;"> *</span></span>
                <input id="ipt_telefone" class="telefone" placeholder="(xx) xxxxx-xxxx">
                <div class="erro" id="erro3"></div>

                <span class="texto">Senha:<span style="color: red;"> *</span></span>
                <input id="ipt_senha" class="senha" type="password" placeholder="Digite sua senha">
                <div class="erro" id="erro4"></div>

                <span class="texto">Confirmar a senha:<span style="color: red;"> *</span></span>
                <input id="ipt_senha2" class="senha" type="password" placeholder="Digite sua senha novamente">
                <div class="erro" id="erro5"></div>

                <div id="mensagem" class="mensagem-feedback"></div>

                <button class="botao" onclick="validar()">CADASTRAR</button>
                <div class="login">Já possui conta? <a href="login.html"><span>Login</span></a></div>
                <a href="index.html" class="voltar-home">
                    Voltar ao Início
                </a>
            </div>
        </div>
    </div>
<script>
    function validar() {
        /* declarações */
        let iptnome = ipt_nome.value.trim()
        let iptemail = ipt_email.value.trim()
        let ipttelefone = ipt_telefone.value.trim()
        let iptsenha = ipt_senha.value.trim()
        let iptsenha2 = ipt_senha2.value.trim()

        let erros = 0
        erro1.innerHTML = ''
        erro2.innerHTML = ''
        erro3.innerHTML = ''
        erro4.innerHTML = ''
        erro5.innerHTML = ''
        mensagem.style.display = 'none'
        mensagem.innerHTML = ''

        ipt_nome.style.borderColor = ""
        ipt_email.style.borderColor = ""
        ipt_telefone.style.borderColor = ""
        ipt_senha.style.borderColor = ""
        ipt_senha2.style.borderColor = ""

        /* validações */
        /* nome */
        if (iptnome.length <= 2) {
            erro1.innerHTML = `Nome inválido (mínimo 3 caracteres)`
            ipt_nome.style.borderColor = "var(--error)"
            erros++
        }
        /* email */
        if (iptemail.length <= 6 || iptemail.indexOf('@') == -1) {
            erro2.innerHTML = `E-mail inválido`
            ipt_email.style.borderColor = "var(--error)"
            erros++
        }
        /* telefone */
        if (ipttelefone.length != 11) {
            erro3.innerHTML = `Número de telefone inválido (ex: 11999998888 - 11 dígitos)`
            ipt_telefone.style.borderColor = "var(--error)"
            erros++
        }
        /* senha */
        if (iptsenha.length < 6) {
            erro4.innerHTML = `Insira no mínimo 6 caracteres para a senha.`
            ipt_senha.style.borderColor = "var(--error)"
            erros++
        }
        if (iptsenha != iptsenha2 || iptsenha2 == '') {
            erro5.innerHTML = `As senhas devem coincidir.`
            ipt_senha2.style.borderColor = "var(--error)"
            erros++
        }

        if (erros == 0) {
            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    nomeServer: iptnome,
                    emailServer: iptemail,
                    senhaServer: iptsenha,
                    telefoneServer: ipttelefone,
                }),
            })
            .then(function (resposta) {
                if (resposta.ok) {
                    mensagem.style.backgroundColor = "rgba(46, 204, 113, 0.15)";
                    mensagem.style.borderColor = "var(--success)";
                    mensagem.style.color = "var(--success)";
                    mensagem.style.display = 'block';
                    mensagem.innerHTML = `Cadastro realizado com sucesso! Redirecionando...`; 
                    setTimeout(() => {
                        window.location = "login.html";
                    }, 1500);
                } else {
                    resposta.text().then(text => {
                        mensagem.style.backgroundColor = "rgba(255, 107, 107, 0.15)";
                        mensagem.style.borderColor = "var(--error)";
                        mensagem.style.color = "var(--error)";
                        mensagem.style.display = 'block';
                        mensagem.innerHTML = `Erro no cadastro: ${text || 'Verifique seus dados.'}`;
                    });
                }
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
                mensagem.style.backgroundColor = "rgba(255, 107, 107, 0.15)";
                mensagem.style.borderColor = "var(--error)";
                mensagem.style.color = "var(--error)";
                mensagem.style.display = 'block';
                mensagem.innerHTML = `Erro de conexão com o servidor.`;
            });
        }

        return false;
    }
</script>
</html>
