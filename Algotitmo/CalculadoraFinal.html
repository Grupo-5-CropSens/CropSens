<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Simulador Financeiro</title>
</head>

<body>

    Quantidade de hectare:<br>
    <input type="text" id="iptHectare"><br><br>

    Quantidade de planta por hectare:<br>
    <input type="text" id="iptPlanta"><br><br>

    A colheita está quantos dias atrasada após a maturação?<br>
    <input type="text" id="iptDias"><br><br>

    <button onclick="btCalcular()">Calcular prejuízo</button>

    <div id="divInvestimento"></div>
    <div id="divCalcular"></div>

</body>

<script>

    function btCalcular() {

        let hectare = Number(iptHectare.value);
        let dias = Number(iptDias.value);
        let planta = Number(iptPlanta.value);


        let investimento = hectare * 7620;

        divInvestimento.innerHTML =
            `Investimento para ${hectare} hectares: R$ ${investimento.toFixed(2)}<br><br>`;

        let porcentagemPerda = 0;

        if (dias <= 10) {
            porcentagemPerda = 0.02;
        }

        else if (dias <= 20) {
            porcentagemPerda = 0.03;
        }

        else if (dias <= 25) {
            porcentagemPerda = 0.05;
        }

        else if (dias <= 30) {
            porcentagemPerda = 0.07;
        }

        else if (dias <= 35) {
            porcentagemPerda = 0.09;
        }

        else if (dias <= 40) {
            porcentagemPerda = 0.12;
        }

        else if (dias <= 50) {
            porcentagemPerda = 0.14;
        }


        /* Produção da Fazenda */

        let kg = planta * 1.3 * 0.17;
        let FazendaTotal = kg * hectare;
        let saca = FazendaTotal / 60;
        let sacaHectare = kg / 60; 


        /* Cálculo de Perda */

        let perdaKg = FazendaTotal * porcentagemPerda;
        let kgFinal= FazendaTotal-perdaKg;
        let perdaSaca = saca * porcentagemPerda;
        let financeiro = perdaSaca * 70.24;

        /* Lucro Líquido Real */
        
        let sacasRest = saca - perdaSaca
        let Receita = sacasRest * 70.24 
        let lucro = Receita - investimento;



        let CropSens = 150;
        let Roi = (financeiro / CropSens) * 100;
        

        if (dias <= 6){

            divCalcular.innerHTML = `Você ainda não teve perdas!<br><br>`

        }

        else{ 

            divCalcular.innerHTML =
        `Kg de milho por Hectare: ${kg.toFixed(2)}kg <br>
        Kg de milho total: ${FazendaTotal.toFixed(2)}kg<br>
        Kg de milho perdidos: ${perdaKg.toFixed(2)}kg<br>
        Kg de milho finais: ${kgFinal.toFixed(2)}kg <br><br>
        Saca por hectare: ${sacaHectare.toFixed(0)} sacas <br>
        Sacas totais: ${saca.toFixed(0)} sacas <br>
        Sacas perdidas: ${perdaSaca.toFixed(0)} sacas <br>
        Sacas Finais: ${sacasRest.toFixed(0)} sacas <br><br>
        Prejuízo financeiro de sacas perdidas: R$${financeiro.toFixed(2)} <br><br>
        Lucro: R$${lucro.toFixed(2)} <br><br>
        Roi do Projeto: ${Roi.toFixed(2)}%`


        }

       
      
    

    }

</script>

</html>
