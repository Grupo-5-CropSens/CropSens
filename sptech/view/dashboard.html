<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gráfico</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="dashboard.css">
</head>

<body>
  <div class="chart-container1" style="background-color: #F9FAFB;">
    <canvas id="myChart"></canvas>
  </div>
      <div class="chart-container2">
          <canvas id="graficoBarras"></canvas>
      </div>


  <script>
    const ctx = document.getElementById('myChart');

    let altura = [50, 80, 120, 160, 200, 224.6];
    let crescimento = [];
    let eficiencia = []

    for (let i = 0; i < altura.length; i++) {

      if (i == 0) {
        crescimento.push(null);
      } else {
        let calc = (altura[i] - altura[i - 1]) / altura[i - 1] * 100;
        crescimento.push(Number(calc.toFixed(1)));
      }

    }

    for (let i = 0; i < crescimento.length; i++) {

      if (i == 0 || crescimento[i] == null) {
        eficiencia.push(null);
      } else {
        let calc = crescimento[i] / 34.6 * 100;
        eficiencia.push(Number(calc.toFixed(1)));
      }

    }

    new Chart(ctx, {
      data: {
        labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4', 'Semana 5', 'Semana 6'],
        datasets: [
          {
            type: 'bar',
            label: 'Altura',
            data: altura,
            borderColor: '#059669', 
            backgroundColor: '#059669',
            borderWidth: 1,
            borderRadius: 8

          },
          {
            type: 'bar',
            label: 'Crescimento (%)',
            data: crescimento,
            //  borderColor: '#FACC15', 
            backgroundColor: '#FBBF24',
            borderWidth: 1,
            borderRadius: 8
          },
          {
            type: 'line',
            label: 'Eficiencia (%)',
            borderColor: '#064E3B', 
            backgroundColor: '#064E3B',
            data: eficiencia,
            borderWidth: 2,
            borderRadius: 5
          }
        ]
      },
      options: {
        plugins: {
          title: {
            display: true,
            text: "Índice de Eficiência Temporal",
            font: {
              size: 18
            },
            color: '#064E3B'
          },
          legend: {
            position: 'bottom'
          }
        },
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    
    /*GRAFICO DE PERDA*/
    const kgs = document.getElementById('graficoBarras');

    let hectares = 1; 
    let perdaPorDiaPorHectare = 39.6; 
    

    let dias = [1, 5, 10, 15, 30];
    

    let perdaKg = dias.map(dia => dia * perdaPorDiaPorHectare * hectares);


    new Chart(kgs, {
      type: 'bar', 
      data: {
        labels: dias.map(d => `Dia ${d}`), 
        datasets: [
          {
            label: 'Perda Acumulada (Kg)',
            data: perdaKg,
            borderColor: '#003814',
            backgroundColor: '#059669',
            borderWidth: 1,
            borderRadius: 5
          },
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: "Perda de Produção (Kg) após Maturação Fisiológica",
            font: { size: 18 },
            color: '#064E3B'
          },
          legend: { position: 'bottom' }
        },
        scales: {
          y: {
            beginAtZero: true,
            title: {
                display: true,
                text: 'Quilos (Kg)'
            }
          },
          x: {
            title: {
                display: true,
                text: 'Dias Decorridos'
            }
          }
        }
      }
    });
  </script>

</body>

</html>
