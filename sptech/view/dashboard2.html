<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Meu Dashboard de Sensores</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard { width: 80%; margin: auto; }
        .chart-container { position: relative; height: 40vh; width: 80vw; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="chart-container">
            <canvas id="graficoBarras"></canvas>
        </div>
    </div>

<script>

    const ctx = document.getElementById('graficoBarras');

    let hectares = 1; 
    let perdaPorDiaPorHectare = 39.6; 
    

    let dias = [1, 5, 10, 15, 30];
    

    let perdaKg = dias.map(dia => dia * perdaPorDiaPorHectare * hectares);


    new Chart(ctx, {
      type: 'bar', 
      data: {
        labels: dias.map(d => `Dia ${d}`), 
        datasets: [
          {
            label: 'Perda Acumulada (Kg)',
            data: perdaKg,
            borderColor: '#003814',
            backgroundColor: '#059669',
            borderWidth: 1,
            borderRadius: 5
          },
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: "Perda de Produção (Kg) após Maturação Fisiológica",
            font: { size: 18 },
            color: '#064E3B'
          },
          legend: { position: 'bottom' }
        },
        scales: {
          y: {
            beginAtZero: true,
            title: {
                display: true,
                text: 'Quilos (Kg)'
            }
          },
          x: {
            title: {
                display: true,
                text: 'Dias Decorridos'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
