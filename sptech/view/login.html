<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(0,0,0,0.4), rgba(0,0,0,0.7)), 
                url(https://www.sygmasistemas.com.br/wp-content/uploads/2024/11/plantacao-de-milho-passo-a-passo.jpg);
            background-size: cover;
            background-position: center;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            width: 350px;
            border-radius: 10px;
            height: 560px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            align-items: center;
            display: flex;
            justify-content: center;
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;

        }

        h2 {
            font-size: 20px;
            text-align: center;
            font-weight: normal;
            color: #161515;
            margin-bottom: 25px;
        }

        .form {
            display: flex;
            flex-direction: column;
            width: 80%;
            gap: 12px;
        }

        label {
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgb(168, 168, 168);
        }

        input::placeholder {
            font-weight: normal;
        }

        .botao {
            background-color: green;
            color: white;
            padding: 12px;
            margin-top: 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .botao:hover {
            background-color: darkgreen;
        }

        .cadastro {
            margin-top: 15px;
            text-align: center;
            font-weight: normal;
        }

        .cadastro span {
            color: green;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="form">
            <h1>Bem-Vindo!</h1>
            <h2>Faça seu login</h2>

            <label>E-mail:</label>
            <input type="email" placeholder="Digite seu e-mail">

            <label>Senha:</label>
            <input type="password" placeholder="Digite sua senha">

            <button class="botao">Entrar</button>

            <div class="cadastro">
                Não possui conta? <a href="#"><span>Cadastrar</span></a>
            </div>
        </div>
    </div>

</body>

</html>
