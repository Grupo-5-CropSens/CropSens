<html lang="en">

<head>

    <title>Document</title>

<style>
    * {
        padding: 0;
        margin: 0;
        font-family: sans-serif;
        font-size: 15px;
        font-weight: bold;
    }

    body {
        background-color: rgb(238, 238, 238);
        display: flex;
        justify-content: end;
        align-items: center;
        min-height: 100vh;
    }

    .card {
        background-color: rgb(255, 255, 255);
        height: 100vh;
        width: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 5px;
    }

    .form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 60%;
    }

    .form input {
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 5px;
        border: 1px solid;
        border-color: rgb(168, 168, 168);
    }

    .form input::placeholder {
        font-weight: 100;
    }

    h1 {
        font-size: 40px;
        text-align: start;
        margin: 0px;
        margin-bottom: 10px;
    }

    .botao {
        background-color: green;
        color: white;
        padding: 15px;
        margin-top: 10px;
        border-radius: 5px;
        border: 0px;
        cursor: pointer;
    }

    .login {
        margin-top: 15px;
        align-self: center;
        font-weight: normal;
        text-decoration: none;
        color: black;
    }

    .login span {
        color: green;
        text-decoration: none;
        font-weight: normal;
    }

    .logo {
        height: 100px;
    }
</style>

<body>

            E-mail:
            <input id="ipt_email" placeholder="Digite seu e-mail">

            Telefone:
            <input id="ipt_telefone" placeholder="(xx) xxxxx-xxxx">

            Senha:
            <input id="ipt_senha" placeholder="Digite sua senha">

            Confirmar a senha:
            <input id="ipt_senha2" placeholder="Digite sua senha novamente">

            <button class="botao" onclick="cadastrar()">Cadastrar</button>
            <div class="login">Já possui conta? <a href=""><span>Login</span></a></div>
        </div>
    </div>
</body>
